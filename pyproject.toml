[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "longor"
version = "0.0.0"
description = "Long-horizon robot task planning and execution"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["utils", "config", "vla_client", "plan", "skills", "executor", "planner", "runner"]
packages = ["envs"]

[tool.pytest.ini_options]
pythonpath = ["src", "services"]
